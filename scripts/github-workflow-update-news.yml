# OPTIONAL: to enable daily server-side news refresh, copy this file to .github/workflows/update-news.yml
# (GitHub web UI: Add file > Create new file). The site already updates news live in the browser without it.
name: Auto-update news & rebuild
on:
  schedule:
    - cron: "17 5 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh headlines
        run: python3 scripts/update_news.py
      - name: Commit changes
        run: |
          git config user.name "brandbz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: daily auto-update"
          git push
